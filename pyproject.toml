[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "future-b"
version = "1.3.0"
description = "Future B (closed): methods-study archive of exact-corrected delayed acceptance for first-principles DiagMC"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Kawa Wong" }]
keywords = [
  "diagrammatic Monte Carlo",
  "electron-phonon",
  "polaron",
  "delayed acceptance",
  "LiF",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
future-b-fepdmc = "future_b.fepdmc.cli:main"

[project.urls]
Homepage = "https://github.com/DarrenWongKaWa/future-b"
Repository = "https://github.com/DarrenWongKaWa/future-b"
Documentation = "https://github.com/DarrenWongKaWa/future-b/blob/main/docs/DISTRIBUTIONS.md"
Issues = "https://github.com/DarrenWongKaWa/future-b/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
future_b = ["fortran/*.f90", "fepdmc/data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

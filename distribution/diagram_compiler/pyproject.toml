[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "future-b-diagram-compiler"
version = "0.2.0"
description = "Experimental fixed-order physics-aware diagram compiler"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Kawa Wong"}]
dependencies = ["numpy>=1.26"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/DarrenWongKaWa/future-b"
ResearchPreview = "https://github.com/DarrenWongKaWa/future-b/releases/tag/diagram-compiler-v0.1.0"

[tool.setuptools.packages.find]
where = ["src"]
include = ["keldysh4ai*"]

[tool.setuptools.package-data]
"keldysh4ai.diagram_compiler" = ["fortran/*.f90"]
"keldysh4ai.scheme_d.physics_first.symbolic" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
